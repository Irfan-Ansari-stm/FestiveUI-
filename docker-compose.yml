version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: festiveui-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: festiveui_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: festiveui-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: festiveui-api
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/festiveui_db?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: "festiveui_super_secret_jwt_access_key_2026"
      JWT_REFRESH_SECRET: "festiveui_super_secret_jwt_refresh_key_2026"
    ports:
      - '4000:4000'

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: festiveui-web
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    ports:
      - '3000:3000'

  super-admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.super-admin
    container_name: festiveui-super-admin
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"
      NEXT_PUBLIC_APP_URL: "http://localhost:3001"
    ports:
      - '3001:3001'

volumes:
  pgdata:
  redisdata:
